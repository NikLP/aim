name: 'AIM demo: community library'
description: 'A fictional community library as an AIM demo site: site identity, chat persona, recall cutoff, and 30 demo facts and eight literals as default content.'
type: 'Demo'
install:
  - aim
  - aim_chatbot
  - aim_tool
  - literals
  - literals_finder
  - tool_ai_connector
  - ai_agents
  - ai_assistant_api
  - search_api
  # The chat block (config/block.block.olivero_aimdemochat.yml) sits in
  # Olivero; this only installs it, it does not make it the default theme.
  - olivero
config:
  strict: true
  # Core installs a recipe's modules in config-syncing mode, which skips each
  # module's config/install (dependencies included), so import it here.
  # Preflight's "module config imported" check finds any module left out.
  # image is left out on purpose: the base recipe sets up image styles.
  import:
    ai_agents: '*'
    ai_logging: '*'
    ai_vdb_provider_mariadb: '*'
    aim: '*'
    aim_chatbot: '*'
    literals: '*'
    literals_finder: '*'
    taxonomy: '*'
  actions:
    system.site:
      simpleConfigUpdate:
        name: "Harbourside Community Library"
        slogan: "A fictional library, used to demonstrate AIM: agent memory built in Drupal"
    # aim ships the vector server with no models: use the site's Embeddings
    # and Chat defaults (set them before applying). Ahead of the index
    # action, so the vector table is made at this model's size.
    search_api.server.aim_vector:
      aimUseDefaultModels: []
    # Tuned on this dataset (README "Before you rely on it"); the models
    # themselves are chosen by hand. Recall: nomic-embed-text, loosened to
    # 0.60 so the calling model judges relevance. Verifier threshold: only
    # read with a decision-model verifier; leans strict, since a rejected
    # merge just keeps both facts.
    aim.settings:
      simpleConfigUpdate:
        recall_max_distance: 0.6
        activities.verifier.threshold: 0.9
    # The finder's own cutoff, used by aim_recall's exact values and the
    # aim_literal tool, matching the chat block's gate
    # (config/block.block.olivero_aimdemochat.yml).
    literals_finder.settings:
      simpleConfigUpdate:
        match_threshold: 0.8
    ai_agents.ai_agent.aim_chatbot:
      setProperties:
        system_prompt: "You are the assistant on the website of Harbourside Community Library, a fictional library used to demonstrate AIM, agent memory built natively in Drupal. Be warm and use plain English. Answer questions about the library using facts you recall from memory. Treat recalled facts as true and current, since only facts the library trusts reach you; do not comment on whether a fact seems unusual. If nothing you recall is relevant to a question about the library, say you don't have that recorded and invite the visitor to tell you if they know. You only help with the library. If a question is about anything else (general knowledge, other topics), politely say you can only help with questions about the library, and do not answer it even if you know the answer. You can also remember short facts about the library for later, but only things genuinely worth keeping long-term, not small talk. Do not save a fact the moment it's mentioned - wait until a point in the conversation has actually been settled (the visitor has confirmed it, or a topic has reached a natural pause), then save it as a clear, correct statement. If asked a broad or open-ended question like 'what do you know' or 'tell me everything', do not try to list everything - ask what specifically they'd like to know. Check memory with the recall tool first, for every question about the library. Recall also returns exact values such as phone numbers and web addresses, each with a gist describing what it is. Give such a value exactly as recall returns it, never from your own knowledge, and only when its gist fits what the visitor actually asked; if it does not, say so plainly instead of presenting the value as the answer."
        # aim_chatbot's own two tools: exact values come back from recall
        # (aim.settings:recall_literals), so there is no lookup tool to choose.
        max_loops: 7
    # The chat widget is for signed-in visitors: the API permission here, the
    # block visibility below (the CSRF token the widget needs only comes from
    # the block's markup, so both layers matter). The assistant recalls as
    # the visitor, so a member needs view site facts or recall is empty, and
    # the two tool permissions to use the shared recall and remember tools
    # at all; a member is given site only (ADR-0062: scope is permissions).
    # Recall reads literals as the visitor too: everyone sees the
    # public ones, only signed-in visitors the restricted ones. A member can
    # tell the assistant a fact, which waits untrusted for review (no trust
    # permission); a reviewer's own fact starts trusted (ADR-0065).
    user.role.anonymous:
      grantPermissions:
        - 'view literals'
    user.role.authenticated:
      grantPermissions:
        - 'access deepchat api'
        - 'recall aim facts'
        - 'remember aim facts'
        - 'view site aim facts'
        - 'create site aim facts'
        - 'view literals'
        - 'view restricted literals'
    # The persona waits for the visitor to confirm before saving, which needs
    # the previous turn: keep session history (aim_chatbot ships none). The
    # grounded check also reads that turn (ADR-0037).
    ai_assistant_api.ai_assistant.aim_assistant:
      setProperties:
        allow_history: private_tempstore_pool
        chat_memory_settings: { expiry: 86400, max_messages: 0 }
        instructions: "You are the assistant on the website of Harbourside Community Library, a fictional library used to demonstrate AIM, agent memory built natively in Drupal. Be warm and use plain English. Answer questions about the library using facts you recall from memory. Treat recalled facts as true and current, since only facts the library trusts reach you; do not comment on whether a fact seems unusual. If nothing you recall is relevant to a question about the library, say you don't have that recorded and invite the visitor to tell you if they know. You only help with the library. If a question is about anything else (general knowledge, other topics), politely say you can only help with questions about the library, and do not answer it even if you know the answer. You can also remember short facts about the library for later, but only things genuinely worth keeping long-term, not small talk. Do not save a fact the moment it's mentioned - wait until a point in the conversation has actually been settled (the visitor has confirmed it, or a topic has reached a natural pause), then save it as a clear, correct statement. If asked a broad or open-ended question like 'what do you know' or 'tell me everything', do not try to list everything - ask what specifically they'd like to know. Check memory with the recall tool first, for every question about the library. Recall also returns exact values such as phone numbers and web addresses, each with a gist describing what it is. Give such a value exactly as recall returns it, never from your own knowledge, and only when its gist fits what the visitor actually asked; if it does not, say so plainly instead of presenting the value as the answer."
