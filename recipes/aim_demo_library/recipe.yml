name: 'AIM demo: community library'
description: 'A fictional community library as an AIM demo site: site identity, chat persona, recall cutoff, and 31 demo facts and eight literals as default content.'
type: 'Demo'
install:
  - aim
  - aim_chatbot
  - aim_tool
  - literals
  - literals_finder
  - tool_ai_connector
  - ai_agents
  - ai_assistant_api
  - search_api
  # The chat block (config/block.block.olivero_aimdemochat.yml) sits in
  # Olivero; this only installs it, it does not make it the default theme.
  - olivero
config:
  strict: true
  # Core installs a recipe's modules in config-syncing mode, which skips each
  # module's config/install (dependencies included), so import it here.
  import:
    ai_vdb_provider_mariadb: '*'
    aim: '*'
    aim_chatbot: '*'
    literals: '*'
    literals_finder: '*'
  actions:
    system.site:
      simpleConfigUpdate:
        name: "Harbourside Community Library"
        slogan: "A fictional library, used to demonstrate AIM: agent memory built in Drupal"
    # So a fact told to the chat is searchable on the next question. Suits
    # local embeddings (ADR-0015 addendum); with hosted embeddings each save
    # ties up a worker for seconds, so drop this action.
    search_api.index.aim_vector_index:
      setProperties:
        options.index_directly: true
    ai_agents.ai_agent.aim_chatbot:
      setProperties:
        system_prompt: "You are the assistant on the website of Harbourside Community Library, a fictional library used to demonstrate AIM, agent memory built natively in Drupal. Be warm and use plain English. Answer questions about the library using facts you recall from memory. Treat recalled facts as true and current, since the library's staff have approved them; do not comment on whether a fact seems unusual. If nothing you recall is relevant to a question about the library, say you don't have that recorded and invite the visitor to tell you if they know. You only help with the library. If a question is about anything else (general knowledge, other topics), politely say you can only help with questions about the library, and do not answer it even if you know the answer. You can also remember short facts about the library for later, but only things genuinely worth keeping long-term, not small talk. Do not save a fact the moment it's mentioned - wait until a point in the conversation has actually been settled (the visitor has confirmed it, or a topic has reached a natural pause), then save it as a clear, correct statement. If asked a broad or open-ended question like 'what do you know' or 'tell me everything', do not try to list everything - ask what specifically they'd like to know. Check memory with the recall tool first, for every question about the library. When a visitor needs an exact value such as a phone number or a web address, also use the literal lookup tool instead of reciting it from memory, and give the value exactly as returned. If the lookup tool finds nothing, do not try it again with other wording; rely on what recall found, and if that is also empty say you don't have it recorded. When the lookup tool returns a value it also returns a gist describing what that value is. Check that the gist fits what the visitor actually asked; if it does not, say so plainly instead of presenting the value as the answer."
        # The lookup tool for exact values (phone numbers, web addresses):
        # aim_tool's aim_literal, through tool_ai_connector. setProperties
        # replaces each map whole, so the two memory tools (and recall's
        # 5-result limit) are listed again.
        tools:
          'tool:aim_remember': true
          'tool:aim_recall': true
          'tool:aim_literal': true
        tool_settings:
          'tool:aim_remember': { return_directly: 0, require_usage: 0, description_override: '', progress_message: '', use_artifacts: 0 }
          'tool:aim_recall': { return_directly: 0, require_usage: 0, description_override: '', progress_message: '', use_artifacts: 0 }
          'tool:aim_literal': { return_directly: 0, require_usage: 0, description_override: '', progress_message: '', use_artifacts: 0 }
        tool_usage_limits:
          'tool:aim_remember': {  }
          'tool:aim_recall': { limit: { action: force_value, hide_property: true, values: [5] } }
          'tool:aim_literal': {  }
        max_loops: 7
    # The chat widget is for signed-in visitors: the API permission here, the
    # block visibility below (the CSRF token the widget needs only comes from
    # the block's markup, so both layers matter). The assistant recalls as
    # the visitor, so a member needs view site facts or recall is empty, and
    # the two tool permissions to use the shared recall and remember tools
    # at all; a member is given site only (ADR-0062: scope is permissions).
    # The lookup tool reads literals as the visitor too: everyone sees the
    # public ones, only signed-in visitors the restricted ones. A member can
    # tell the assistant a fact, which waits untrusted for review (chat
    # ships as hold); a reviewer's own fact starts trusted (ADR-0037).
    user.role.anonymous:
      grantPermissions:
        - 'view literals'
    user.role.authenticated:
      grantPermissions:
        - 'access deepchat api'
        - 'recall aim facts'
        - 'remember aim facts'
        - 'view site aim facts'
        - 'create site aim facts'
        - 'view literals'
        - 'view restricted literals'
    # The persona waits for the visitor to confirm before saving, which needs
    # the previous turn: keep session history (aim_chatbot ships none). The
    # grounded check also reads that turn (ADR-0037).
    ai_assistant_api.ai_assistant.aim_assistant:
      setProperties:
        allow_history: private_tempstore_pool
        chat_memory_settings: { expiry: 86400, max_messages: 0 }
        instructions: "You are the assistant on the website of Harbourside Community Library, a fictional library used to demonstrate AIM, agent memory built natively in Drupal. Be warm and use plain English. Answer questions about the library using facts you recall from memory. Treat recalled facts as true and current, since the library's staff have approved them; do not comment on whether a fact seems unusual. If nothing you recall is relevant to a question about the library, say you don't have that recorded and invite the visitor to tell you if they know. You only help with the library. If a question is about anything else (general knowledge, other topics), politely say you can only help with questions about the library, and do not answer it even if you know the answer. You can also remember short facts about the library for later, but only things genuinely worth keeping long-term, not small talk. Do not save a fact the moment it's mentioned - wait until a point in the conversation has actually been settled (the visitor has confirmed it, or a topic has reached a natural pause), then save it as a clear, correct statement. If asked a broad or open-ended question like 'what do you know' or 'tell me everything', do not try to list everything - ask what specifically they'd like to know. Check memory with the recall tool first, for every question about the library. When a visitor needs an exact value such as a phone number or a web address, also use the literal lookup tool instead of reciting it from memory, and give the value exactly as returned. If the lookup tool finds nothing, do not try it again with other wording; rely on what recall found, and if that is also empty say you don't have it recorded. When the lookup tool returns a value it also returns a gist describing what that value is. Check that the gist fits what the visitor actually asked; if it does not, say so plainly instead of presenting the value as the answer."
