services:
  # Scope type plugins come from src/Plugin/AimScopeType of every enabled
  # module (#[AimScopeType]). entity_type.manager follows
  # default_plugin_manager's three arguments: getTypePlugin() loads the
  # aim_scope to read its plugin and settings.
  plugin.manager.aim_scope_type:
    class: Drupal\aim\AimScopeTypePluginManager
    parent: default_plugin_manager
    arguments: ['@entity_type.manager']

  aim.settings_reader:
    class: Drupal\aim\Service\AimSettings
    autowire: true

  Drupal\aim\Service\AimSettings:
    alias: aim.settings_reader

  aim.grounding_checker:
    class: Drupal\aim\Service\AimGroundingChecker
    autowire: true

  Drupal\aim\Service\AimGroundingChecker:
    alias: aim.grounding_checker

  aim.trust_policy:
    class: Drupal\aim\Service\AimTrustPolicy
    autowire: true

  Drupal\aim\Service\AimTrustPolicy:
    alias: aim.trust_policy

  aim.memory_manager:
    class: Drupal\aim\Service\AimMemoryManager
    autowire: true

  aim.consolidation:
    class: Drupal\aim\Service\AimConsolidationService
    autowire: true

  Drupal\aim\Service\AimConsolidationService:
    alias: aim.consolidation

  aim.recall:
    class: Drupal\aim\Service\AimRecallService
    autowire: true

  Drupal\aim\Service\AimRecallService:
    alias: aim.recall

  aim.remember:
    class: Drupal\aim\Service\AimRememberService
    autowire: true

  Drupal\aim\Service\AimRememberService:
    alias: aim.remember

  # Class alias so autowired consumers (the auto-registered AimHooks
  # service, src/Hook/AimHooks.php) can type-hint AimMemoryManager
  # directly, same pattern the annotations module (dotdev suite) uses for
  # its own AnnotationStorageService.
  Drupal\aim\Service\AimMemoryManager:
    alias: aim.memory_manager

  # Shared by aim:status (Drush) and AimStatusController
  # (/admin/config/aim/status) - see AimStatusChecker's own docblock.
  aim.status_checker:
    class: Drupal\aim\AimStatusChecker
    autowire: true

  Drupal\aim\AimStatusChecker:
    alias: aim.status_checker

  # ADR-0017's dedicated cache bin for query-time embeddings, kept separate
  # from cache.default so it can be flushed or redirected to another
  # backend on its own. Database-backed, same as cache.default on this
  # site (no Redis) - see AimEmbeddingCacheSubscriber.
  cache.aim_embeddings:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [aim_embeddings]

  logger.channel.aim:
    class: Drupal\Core\Logger\LoggerChannel
    factory: logger.factory:get
    arguments: ['aim']

  aim.embedding_cache_subscriber:
    class: Drupal\aim\EventSubscriber\AimEmbeddingCacheSubscriber
    autowire: true
    tags:
      - { name: event_subscriber }

  aim.call_log_subscriber:
    class: Drupal\aim\EventSubscriber\AimCallLogSubscriber
    autowire: true
    tags:
      - { name: event_subscriber }

  Drupal\aim\EventSubscriber\AimCallLogSubscriber:
    alias: aim.call_log_subscriber

  aim.backend.decision:
    class: Drupal\aim\Backend\DecisionBackend
    autowire: true


  aim.backend.chat:
    class: Drupal\aim\Backend\ChatBackend
    autowire: true


  # Class alias, same reason as AimMemoryManager's above - aim_benchmark's
  # Drush commands type-hint this directly to toggle aim:benchmark's cache
  # bypass.
  Drupal\aim\EventSubscriber\AimEmbeddingCacheSubscriber:
    alias: aim.embedding_cache_subscriber
