services:
  # Scope access plugins are discovered from src/Plugin/AimScopeAccess of
  # every enabled module via the #[AimScopeAccess] attribute - no
  # per-plugin registration needed here. AimScopeUser (aim_scope_user,
  # ADR-0025's first dedicated plugin) gets its own dependencies through
  # this manager's DefaultPluginManager container-aware instantiation, not
  # a services.yml entry of its own.
  plugin.manager.aim_scope_access:
    class: Drupal\aim\AimScopeAccessPluginManager
    parent: default_plugin_manager

  aim.scope_uninstall_validator:
    class: Drupal\aim\ScopeUninstallValidator
    arguments:
      - '@config.manager'
      - '@entity_type.manager'
    tags:
      - { name: module_install.uninstall_validator }

  aim.memory_manager:
    class: Drupal\aim\Service\AimMemoryManager
    arguments:
      - '@ai.provider'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@Drupal\ai\Guardrail\AiGuardrailRepository'
      - '@queue'
      - '@entity_type.bundle.info'
      - '@plugin.manager.aim_scope_access'
      - '@config.factory'
      - '@current_user'
      - '@aim.embedding_cache_subscriber'

  # Class alias so autowired consumers (the auto-registered AimHooks
  # service, src/Hook/AimHooks.php) can type-hint AimMemoryManager
  # directly, same pattern the annotations module (dotdev suite) uses for
  # its own AnnotationStorageService.
  Drupal\aim\Service\AimMemoryManager:
    alias: aim.memory_manager

  # ADR-0017's dedicated cache bin for query-time embeddings, kept separate
  # from cache.default so it can be flushed or redirected to another
  # backend on its own. Database-backed, same as cache.default on this
  # site (no Redis) - see AimEmbeddingCacheSubscriber.
  cache.aim_embeddings:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [aim_embeddings]

  logger.channel.aim:
    class: Drupal\Core\Logger\LoggerChannel
    factory: logger.factory:get
    arguments: ['aim']

  aim.embedding_cache_subscriber:
    class: Drupal\aim\EventSubscriber\AimEmbeddingCacheSubscriber
    arguments:
      - '@cache.aim_embeddings'
      - '@datetime.time'
      - '@logger.channel.aim'
    tags:
      - { name: event_subscriber }

  # Class alias, same reason as AimMemoryManager's above - AimCommands
  # type-hints this directly to toggle aim:benchmark's cache bypass.
  Drupal\aim\EventSubscriber\AimEmbeddingCacheSubscriber:
    alias: aim.embedding_cache_subscriber
