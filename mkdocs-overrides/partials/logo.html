{#- The project's logo, and, when extra.logo_inverted names one, its white
    variant, which drupal-pages.css shows on the Navy title of the mobile
    menu instead. The link around the logo carries the site's name. -#}
<img class="drupal-logo" src="{{ config.theme.logo | url }}" alt="" width="40" height="40">
{%- if config.extra.logo_inverted %}
<img class="drupal-logo drupal-logo--inverted" src="{{ config.extra.logo_inverted | url }}" alt="" width="40" height="40">
{%- endif %}
