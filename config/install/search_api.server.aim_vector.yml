langcode: en
status: true
dependencies:
  module:
    - ai_search
    - ai_vdb_provider_mariadb
id: aim_vector
name: 'AIM Vector Search'
description: ''
backend: search_api_ai_search
backend_config:
  chat_model: amazeeio__claude-5-sonnet
  database: mariadb
  database_settings:
    database_name: ''
    collection: aim_facts
    metric: cosine_similarity
  embeddings_engine: amazeeio__mistral-embed
  embeddings_engine_configuration:
    set_dimensions: true
    dimensions: 1024
  embedding_strategy: contextual_chunks
  embedding_strategy_configuration:
    chunk_size: '500'
    chunk_min_overlap: '100'
    contextual_content_max_percentage: '30'
    skip_moderation: false
  include_raw_embedding_vector: false
