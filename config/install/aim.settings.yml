auto_threshold: 0.09
ambiguous_threshold: 0.45
neighbor_limit: 3
merge_verify: true
activities:
  extraction: { backend: chat, provider: '', model: '' }
  consolidation: { backend: chat, provider: '', model: '' }
  verifier: { backend: chat, provider: '', model: '' }
merge_max_distance: 0
recall_max_distance: 0.45
recall_gap: 0
default_trusted: false
show_redacted_facts: false
log_audit: false
log_verbose: false
log_query_text: false
user_scope_shared_role_fallback: true
user_scope_role_visibility: {  }
extraction_prompt: |
  Extract every discrete, atomic fact worth remembering long-term from the text below.
  Each fact must be one short sentence that makes sense with no other context: say what it is about (a product, team or role, never "it", "they" or "that channel"), and never refer to "the above" or to another fact.
  Do not add names, organizations or other identifying details that the fact does not need to make sense.
  Keep uncertainty in the fact: if the text says something is planned, possible or undecided, say so in the sentence.
  Do not invent facts the text does not support. If nothing is worth remembering, return an empty facts array.

  For each fact, classify its scope:
  - "user": specific to one named person.
  - "role": true for everyone holding a particular role.
  - "site": about the site or organization itself, not one person.
  - "case": tied to a specific project, case or tracked issue, named by the caller.

  Also give a short "subject"; for:
  - "user" scope, the person's name or identifier
  - "role", the role name
  - "case", only an identifier given in the text or by the caller; never invent one. If none is given, use "site" scope instead
  - "site", leave it empty

  Text:
  """
  {text}
  """
consolidation_prompt: |
  Two memory facts about the same scope and subject were flagged as possibly related.
  Decide what to do with the candidate fact relative to the existing one.

  Existing fact: "{kept_text}"
  Candidate fact: "{candidate_text}"

  Choose one decision:
  - "ADD": the two facts are genuinely different and both should be   kept as-is.
  - "UPDATE": the candidate refines, corrects, or supersedes the existing fact
  (e.g. a changed preference). Provide a single merged statement in merged_text
  that replaces the existing fact's text.
  - "NOOP": the candidate simply restates the existing fact with no new information.
  The existing fact stands unchanged and the candidate is redundant.
  - "DELETE": the candidate fact should not exist as a memory at all
  (e.g. nonsensical or clearly erroneous). Use sparingly.

  When unsure whether the candidate is a refinement or a distinct fact, choose "ADD":
  merging is where nuance is lost, and keeping both facts is always safe.

  For any decision other than UPDATE, set merged_text to the existing fact's text unchanged.
merge_prompt: |
  Merge these two memory facts into one short sentence that keeps every detail
  of both (names, numbers, dates, conditions, negations) and adds nothing else.
  If they conflict, the newer fact wins.

  Existing fact: "{kept_text}"
  Newer fact: "{candidate_text}"
merge_verify_prompt: |
  A memory system proposes replacing two facts with one merged fact.
  Judge only faithfulness to the inputs, not whether they are true.

  Fact A: "{kept_text}"
  Fact B: "{candidate_text}"
  Merged: "{merged_text}"

  Set faithful to true only if every detail of Fact A and Fact B survives in
  Merged (names, numbers, dates, conditions, negations) and Merged adds
  nothing that neither fact states, except where Fact B plainly corrects or
  supersedes a detail of Fact A. Otherwise set faithful to false.
