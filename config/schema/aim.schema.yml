aim.settings:
  type: config_object
  label: 'AIM settings'
  mapping:
    auto_threshold:
      type: float
      label: 'Auto-merge threshold'
      constraints:
        Range:
          min: 0
          max: 1
    ambiguous_threshold:
      type: float
      label: 'Ambiguous threshold'
      constraints:
        Range:
          min: 0
          max: 1
    neighbor_limit:
      type: integer
      label: 'Neighbors compared per fact during consolidation'
      constraints:
        Range:
          min: 1
          max: 10
    merge_verify:
      type: boolean
      label: 'Verify merged text with a model before accepting an UPDATE'
    activities:
      type: mapping
      label: 'Backend, provider and model per activity, empty provider and model for the site default chat model'
      mapping:
        extraction:
          type: aim.activity_choice
        consolidation:
          type: aim.activity_choice
        verifier:
          type: aim.activity_choice
        grounding:
          type: aim.activity_choice
    grounding_mode:
      type: string
      label: 'Grounded check: off, shadow (record the score only) or enforce (also set trusted)'
      constraints:
        Choice: ['off', shadow, enforce]
    merge_max_distance:
      type: float
      label: 'Maximum merged-to-input embedding distance, 0 disables'
      constraints:
        Range:
          min: 0
          max: 1
    merge_prompt:
      type: string
      label: 'Merge writer prompt, used when the classifier is a decision model'
    merge_verify_prompt:
      type: string
      label: 'Merge verification prompt'
    recall_max_distance:
      type: float
      label: 'Chatbot recall maximum distance'
      constraints:
        Range:
          min: 0
          max: 1
    recall_gap:
      type: float
      label: 'Keep only recalled facts within this distance of the best match (0 = off)'
      constraints:
        Range:
          min: 0
          max: 1
    default_trusted:
      type: boolean
      label: 'Trust new facts by default'
    trust_policy:
      type: mapping
      label: 'Starting trust per entry channel and scope (ADR-0037 addendum 2026-10-18)'
      mapping:
        default:
          type: string
          label: 'Fallback policy: trusted, untrusted or hold; empty follows default_trusted'
          constraints:
            Choice: ['', trusted, untrusted, hold]
        channels:
          type: sequence
          label: 'Policy per entry channel (chat, mcp, ingest, drush)'
          sequence:
            type: string
            constraints:
              Choice: [trusted, untrusted, hold]
        scopes:
          type: sequence
          label: 'Policy per scope ID, used when the channel has no rule'
          sequence:
            type: string
            constraints:
              Choice: [trusted, untrusted, hold]
    show_redacted_facts:
      type: boolean
      label: 'Show a fact with [redacted] in place of a literal the viewer cannot read, instead of withholding it (debug)'
    log_audit:
      type: boolean
      label: 'Log audit events (writes, consolidation decisions, trust and retire actions)'
    log_verbose:
      type: boolean
      label: 'Log verbose detail (recall, embedding cache, extraction)'
    log_query_text:
      type: boolean
      label: 'Include recall query text in verbose logs (personal data)'
    # string, not text: text is core's translatable-string type, and these
    # are instructions to a model, not UI strings for a translator. Declaring
    # them text would make config validation demand a langcode on this
    # config object (LangcodeRequiredIfTranslatableValues).
    extraction_prompt:
      type: string
      label: 'Extraction prompt'
    consolidation_prompt:
      type: string
      label: 'Consolidation prompt'
    user_scope_shared_role_fallback:
      type: boolean
      label: 'Allow user-scope visibility when viewer and subject share a role'
    user_scope_role_visibility:
      type: sequence
      label: 'User-scope role visibility matrix, keyed by viewer role ID'
      sequence:
        type: sequence
        label: 'Subject role IDs visible to this viewer role'
        sequence:
          type: string
          label: 'Role ID'

aim.aim_scope.*:
  type: config_entity
  label: 'AIM scope'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    plugin:
      type: string
      label: 'AimScopeType plugin ID (ADR-0028 piece 3), empty for a plain config-only scope'
      nullable: true
      constraints:
        PluginExists:
          manager: plugin.manager.aim_scope_type
          interface: '\Drupal\aim\Plugin\AimScopeType\AimScopeTypeInterface'
    settings:
      type: ignore
      label: 'Instance settings for plugin, shape defined by the plugin itself'

aim.activity_choice:
  type: mapping
  label: 'An activity backend with its provider and model choice'
  mapping:
    backend:
      type: string
      label: 'Backend: chat or decision'
      constraints:
        Choice: [chat, decision]
    provider:
      type: string
      label: 'Provider plugin ID'
    model:
      type: string
      label: 'Model ID'
    max_questions:
      type: integer
      label: 'Grounding only: candidates per decision call, 0 or absent for the default (16, the smallest provider cap seen)'
      constraints:
        Range:
          min: 0
    threshold:
      type: float
      label: 'Verifier and grounding only: probability a decision model must reach, 0 or absent for the default (0.5 verifier, 0.7 grounding)'
      constraints:
        Range:
          min: 0
          max: 1
