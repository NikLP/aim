aim.settings:
  type: config_object
  label: 'AIM settings'
  mapping:
    auto_threshold:
      type: float
      label: 'Auto-merge threshold'
    ambiguous_threshold:
      type: float
      label: 'Ambiguous threshold'
    extraction_prompt:
      type: text
      label: 'Extraction prompt'
    consolidation_prompt:
      type: text
      label: 'Consolidation prompt'

aim.aim_scope.*:
  type: config_entity
  label: 'AIM scope'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
