administer aim:
  title: 'Administer AIM'
  description: 'Configure AIM and create, edit and delete facts in every scope.'
  restrict access: true

ingest aim facts:
  title: 'Ingest documents into AIM'
  description: 'Use the AIM ingest form (upload a document or fact file; facts are extracted with a model or read as given). Each fact also needs the create permission for its scope.'
  restrict access: true

review aim facts:
  title: 'Review AIM facts'
  description: 'Trust and untrust facts in every scope via the bulk actions on the facts listing, without changing their text.'
  restrict access: true

permission_callbacks:
  - \Drupal\aim\AimPermissions::permissions
