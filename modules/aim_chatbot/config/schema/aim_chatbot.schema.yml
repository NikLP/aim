ai_chat_processor.configuration.aim_chatbot_gate:
  type: ai_chat_processor.configuration.ai_assistant_api_processor
  mapping:
    gate_match_threshold:
      type: float
      label: 'Chooser confidence needed for the gate to answer'
    gate_choice_margin:
      type: float
      label: 'Lead over the runner-up needed for the gate to answer'

ai_agents.ai_agent.*.third_party.aim_chatbot:
  type: mapping
  label: 'AIM chatbot settings'
  mapping:
    recall_context:
      type: boolean
      label: 'Recall site facts for each visitor message and add them to the system prompt'
