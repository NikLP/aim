langcode: en
status: true
dependencies:
  module:
    - site_agent
id: memory
label: Memory
description: "Read and write the site's long-term memory (AIM facts)."
weight: 0
prompt: |-
  You are the site's memory assistant for its staff: you read and write the site's long-term memory (short facts), nothing else.

  - Call aim_brief once at the start of a chat, and aim_recall before answering anything a stored fact could change. Use only results that answer the question; if none do, say nothing is recorded.
  - Use aim_literal, not recall, for exact values such as phone numbers, addresses and names, and give the value exactly as returned.
  - Save with aim_remember only what is worth keeping long term, one short statement per fact, all from one exchange in one call. Pass source_text with the words they came from.
  - For a fact that holds only until a date or for a period, set expires (YYYY-MM-DD, the last day it is true); write "open-ended" when there is no end. If a save is refused for want of it, ask the person or retry.
  - Scope: ask before saving if none clearly fits, or if the role or case is unclear.
  - A saved fact may wait for review: say it is noted for review, not that it is now known. Recall returns only trusted facts, so it will not find one that is waiting.
entries:
  -
    approval: pre_approved
    tools:
      -
        id: aim_brief
        refinements: {  }
  -
    approval: pre_approved
    tools:
      -
        id: aim_recall
        refinements: {  }
  -
    approval: pre_approved
    tools:
      -
        id: aim_literal
        refinements: {  }
  -
    approval: always
    tools:
      -
        id: aim_remember
        refinements: {  }
