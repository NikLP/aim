services:
  aim_tool.scope_guide:
    class: Drupal\aim_tool\AimScopeGuide
    arguments: ['@aim.memory_manager', '@entity_type.manager']
  # So autowired hook classes (AimToolHooks, aim_tool_oauth's) can
  # type-hint it.
  Drupal\aim_tool\AimScopeGuide: '@aim_tool.scope_guide'
  # #[ToolMethod] services (ADR-0044): Tool API discovers each tool from its
  # attributed method; the tool ID is on the attribute, not the service ID.
  aim_tool.recall:
    class: Drupal\aim_tool\Tool\AimRecall
    autowire: true
  aim_tool.brief:
    class: Drupal\aim_tool\Tool\AimBrief
    autowire: true
  aim_tool.literal:
    class: Drupal\aim_tool\Tool\AimLiteral
    # literals.lookup has no class alias to autowire from.
    arguments: ['@literals.lookup', '@current_user', '@module_handler']
  aim_tool.remember:
    class: Drupal\aim_tool\Tool\AimRemember
    autowire: true
  # Hands aim_remember its Tool API invoker, which picks the trust channel
  # (ADR-0062).
  aim_tool.remember_invoker_subscriber:
    class: Drupal\aim_tool\EventSubscriber\AimRememberInvokerSubscriber
    arguments: ['@aim_tool.remember']
    tags:
      - { name: event_subscriber }
