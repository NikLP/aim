# Documentation site, built by bin/build-docs.sh (see .gitlab-ci.yml).
# Look: the Drupal.org project-pages stylesheet copied from the Site Agent
# project, for research purposes only (see docs/assets/NOTICE.md).
site_name: AIM
site_description: Drupal-native AI agent memory infrastructure.
site_url: https://project.pages.drupalcode.org/aim/
docs_dir: docs
use_directory_urls: false
copyright: AIM is licensed under GPL-2.0-or-later. Drupal is a registered trademark of Dries Buytaert. Site styling borrowed from the Site Agent project for research purposes only.

theme:
  name: material
  custom_dir: mkdocs-overrides
  # Noto Sans ships in docs/assets/fonts; ZT Gatha is deliberately not
  # bundled, so headings fall back to Noto Sans.
  font: false
  logo: assets/aim.svg
  favicon: assets/aim.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow

extra_css:
  - assets/stylesheets/drupal-pages.css

extra_javascript:
  - assets/javascripts/drupal-pages.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Overview: README.md
  - Developer reference: DEVELOPING.md
  - Submodules:
      - Scopes:
          - User: modules/aim_scope_user/README.md
          - Role: modules/aim_scope_role/README.md
          - Site: modules/aim_scope_site/README.md
          - Case: modules/aim_scope_case/README.md
          - Entity: modules/aim_scope_entity/README.md
      - Chatbot:
          - Overview: modules/aim_chatbot/README.md
          - Developer reference: modules/aim_chatbot/DEVELOPING.md
      - Tool API and MCP:
          - Overview: modules/aim_tool/README.md
          - Developer reference: modules/aim_tool/DEVELOPING.md
      - Tool OAuth:
          - Overview: modules/aim_tool_oauth/README.md
          - Developer reference: modules/aim_tool_oauth/DEVELOPING.md
      - Benchmark:
          - Overview: modules/aim_benchmark/README.md
          - Developer reference: modules/aim_benchmark/DEVELOPING.md
  - Recipes:
      - Demo library: recipes/aim_demo_library/README.md
      - Local Ollama: recipes/aim_ollama_local/README.md
  - Decisions: adr/0000-index.md
