aim.admin_config:
  path: '/admin/config/aim'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'AIM'
  requirements:
    _permission: 'administer aim memory'

aim.settings:
  path: '/admin/config/aim/settings'
  defaults:
    _form: '\Drupal\aim\Form\AimSettingsForm'
    _title: 'AIM settings'
  requirements:
    _permission: 'administer aim memory'

aim.user_scope_access:
  path: '/admin/config/aim/user-scope-access'
  defaults:
    _form: '\Drupal\aim\Form\AimScopeUserAccessForm'
    _title: 'AIM user-scope visibility'
  requirements:
    _permission: 'administer aim memory'

aim.status:
  path: '/admin/config/aim/status'
  defaults:
    _controller: '\Drupal\aim\Controller\AimStatusController::build'
    _title: 'AIM status'
  requirements:
    _permission: 'administer aim memory'

aim.ingest:
  path: '/admin/content/aim-facts/ingest'
  defaults:
    _form: '\Drupal\aim\Form\AimIngestForm'
    _title: 'Ingest'
  requirements:
    _permission: 'ingest aim memory'
